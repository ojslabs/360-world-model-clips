name: Verify app and container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-linux.lock
          python -m app.crowd_audio --setup-model
      - name: Verify complete media decoding
        run: python -m unittest -v tests.python.test_media.MediaTests.test_strict_verification_rejects_decoder_errors_even_with_exit_zero tests.python.test_composite.CompositeTests.test_endpoint_verification_still_decodes_video_and_audio_after_the_orbit
      - name: Verify Python and browser behavior
        run: |
          python -m unittest discover -s tests/python -t . -v
          node --check ui/app.js
          node --test tests/js/*.js ui/live-client/test_controller.mjs
          python -m scripts.build_ui
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build deployment image
        run: docker build -t world-model-clips:ci .
      - name: Run protected container with fresh data
        run: python scripts/container_smoke.py --image world-model-clips:ci
  fresh-install:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and run the public installer without host language or media tools
        run: python3 -m scripts.install_smoke --ref "$GITHUB_SHA"
